<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="kingmasterpc - GitHub Profile Banner (Light Mode)">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glass Panel Gradient -->
    <linearGradient id="panelGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="borderShimmerLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentTextLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeftLight" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomRightLight" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPatternLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
      .pill-light { rx: 6px; ry: 6px; fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .pill-txt-light { font-size: 11px; fill: #475569; font-weight: 600; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="24" fill="url(#bgGradLight)" />
  <rect width="1180" height="610" rx="24" fill="url(#gridPatternLight)" />
  <rect width="1180" height="610" rx="24" fill="url(#glowTopLeftLight)" />
  <rect width="1180" height="610" rx="24" fill="url(#glowBottomRightLight)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#borderShimmerLight)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(30, 28)">
    <!-- Terminal Traffic Dots -->
    <circle cx="12" cy="14" r="5.5" fill="#ef4444" />
    <circle cx="28" cy="14" r="5.5" fill="#eab308" />
    <circle cx="44" cy="14" r="5.5" fill="#22c55e" />

    <!-- Terminal Breadcrumb -->
    <text x="68" y="18" fill="#64748b" class="mono" font-size="12" font-weight="600">quantran303@developer:~ [ kingmasterpc ]</text>

    <!-- Status Indicator -->
    <g transform="translate(1020, 8)">
      <circle cx="0" cy="10" r="4" fill="#059669">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="12" y="14" fill="#059669" class="mono" font-size="11" font-weight="700" letter-spacing="1">ONLINE</text>
    </g>
    <!-- Separator Line -->
    <line x1="0" y1="36" x2="1120" y2="36" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- ================= LEFT PANEL (VISUAL IDENTITY) ================= -->
  <g transform="translate(36, 82)">
    <!-- Glass Background Box -->
    <rect width="420" height="495" rx="16" fill="url(#panelGradLight)" stroke="#cbd5e1" stroke-width="1" />

    <!-- Header / Tab -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 404 0 C 412.84 0 420 7.16 420 16 L 420 40 L 0 40 Z" fill="#e2e8f0" />
    <text x="20" y="25" fill="#0284c7" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">VISUAL.IDENTITY // BLESS_CODE</text>
    <line x1="0" y1="40" x2="420" y2="40" stroke="#cbd5e1" stroke-width="1" />

    <!-- ASCII Art Container (Buddha Bless - Chubby & Symmetrical) -->
    <g transform="translate(25, 56)">
      <rect width="370" height="276" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

      <!-- ASCII Character Matrix (Chubby Buddha) centered with text-anchor="middle" and letter-spacing -->
      <g fill="#4338ca" class="mono" font-size="8" letter-spacing="1.1" opacity="0.95" text-anchor="middle" xml:space="preserve">
        <text x="185" y="24">_oo0oo_</text>
        <text x="185" y="38">o8888888o</text>
        <text x="185" y="52">88"   .   "88</text>
        <text x="185" y="66">(|   -_-   |)</text>
        <text x="185" y="80">0\    =    /0</text>
        <text x="185" y="94">___/   `---'   \___</text>
        <text x="185" y="108">.'  \\|       |//  '.</text>
        <text x="185" y="122">/  \\|||    :    |||//  \</text>
        <text x="185" y="136">/  _|||||   -:-   |||||-  \</text>
        <text x="185" y="150">|    |  \\\   -   ///  |    |</text>
        <text x="185" y="164">|  \_|   ''\ --- /''   |_/  |</text>
        <text x="185" y="178">\   .-\__   '-'   ___/-.   /</text>
        <text x="185" y="192">___'.  .'   /--.--\   `.  .'___</text>
        <text x="185" y="206">.""  '&lt;   `.___\\_&lt;|&gt;_/___.'   &gt;'  "".</text>
        <text x="185" y="220">|  |  :   `- \\`.;`\\  _  /`;.`/ - `   :  |  |</text>
        <text x="185" y="234">\   \  `_.    \\_ __\\ /__ _/    .-`  /   /</text>
        <text x="185" y="248">=====`-.____`.___  \\_____/  ___.-`___.-'=====</text>
        <text x="185" y="262">`=---='</text>
      </g>

      <!-- Scanline highlight over ASCII -->
      <line x1="10" y1="20" x2="360" y2="20" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6">
        <animate attributeName="y1" values="10;265;10" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="10;265;10" dur="4.5s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Sub-info below ASCII -->
    <g transform="translate(25, 355)">
      <text x="0" y="16" fill="#64748b" class="mono" font-size="11" letter-spacing="1">IDENTIFIER</text>
      <text x="0" y="38" fill="#0f172a" class="sans" font-size="18" font-weight="700">kingmasterpc</text>
      <text x="135" y="38" fill="#4338ca" class="mono" font-size="12">(@quantran303)</text>

      <text x="0" y="72" fill="#475569" class="mono" font-size="11.5" line-height="1.5">
        <tspan x="0" dy="0">High school student &amp; code enthusiast,</tspan>
        <tspan x="0" dy="18">exploring algorithms, C++ &amp; web technology.</tspan>
      </text>

      <g transform="translate(0, 108)">
        <text x="0" y="12" fill="#0284c7" class="mono" font-size="11">~/student $</text>
        <text x="80" y="12" fill="#1e293b" class="mono" font-size="11">learn --code --grow</text>
        <rect x="235" y="2" width="6" height="12" fill="#4f46e5">
          <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL (SYSTEM.INFO) ================= -->
  <g transform="translate(480, 82)">
    <!-- Glass Background Box -->
    <rect width="665" height="495" rx="16" fill="url(#panelGradLight)" stroke="#cbd5e1" stroke-width="1" />

    <!-- Panel Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 649 0 C 657.84 0 665 7.16 665 16 L 665 40 L 0 40 Z" fill="#e2e8f0" />
    <text x="24" y="25" fill="#4338ca" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM.INFO // PROFILE</text>
    <text x="560" y="25" fill="#64748b" class="mono" font-size="10">sh ./profile.sh</text>
    <line x1="0" y1="40" x2="665" y2="40" stroke="#cbd5e1" stroke-width="1" />

    <!-- Primary Title & Role -->
    <g transform="translate(28, 64)">
      <text x="0" y="24" fill="url(#accentTextLight)" class="sans" font-size="28" font-weight="800" letter-spacing="-0.5">kingmasterpc</text>

      <!-- Role -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#0284c7" class="mono" font-size="14" font-weight="600">&gt; Student · Coding Enthusiast · Aspiring Developer</text>
      </g>
    </g>

    <!-- Metadata Grid Rows -->
    <g transform="translate(28, 142)" class="mono" font-size="12">
      <!-- Row 1 -->
      <text x="0" y="16" fill="#64748b" font-weight="600">&gt; STATUS</text>
      <text x="120" y="16" fill="#1e293b">High School Student 🎓</text>

      <!-- Row 2 -->
      <text x="0" y="44" fill="#64748b" font-weight="600">&gt; LOCATION</text>
      <text x="120" y="44" fill="#1e293b">Vietnam 🇻🇳  [ UTC +07:00 ]</text>

      <!-- Row 3 -->
      <text x="0" y="72" fill="#64748b" font-weight="600">&gt; FOCUS</text>
      <text x="120" y="72" fill="#1e293b">C++ Algorithms · Python Scripting · Web Basics (HTML/CSS/JS)</text>

      <!-- Row 4 -->
      <text x="0" y="100" fill="#64748b" font-weight="600">&gt; EMAIL</text>
      <text x="120" y="100" fill="#0284c7">quantrandn2009@gmail.com</text>

      <!-- Row 5 -->
      <text x="0" y="128" fill="#64748b" font-weight="600">&gt; DISCORD</text>
      <text x="120" y="128" fill="#4338ca">kingmaster_pc (ID: 930329057390891078)</text>
    </g>

    <!-- Tech Stack Category Box -->
    <g transform="translate(28, 290)">
      <text x="0" y="0" fill="#64748b" class="mono" font-size="11" font-weight="700" letter-spacing="1">CURRENT_SKILLS // LANGUAGES &amp; TOOLS</text>

      <!-- Row 1 Pills -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="85" height="26" class="pill-light" />
        <circle cx="12" cy="13" r="3" fill="#00599c" />
        <text x="24" y="17" class="mono pill-txt-light">C / C++</text>

        <rect x="95" y="0" width="85" height="26" class="pill-light" />
        <circle cx="107" cy="13" r="3" fill="#3776ab" />
        <text x="119" y="17" class="mono pill-txt-light">Python</text>

        <rect x="190" y="0" width="75" height="26" class="pill-light" />
        <circle cx="202" cy="13" r="3" fill="#e34f26" />
        <text x="214" y="17" class="mono pill-txt-light">HTML5</text>

        <rect x="275" y="0" width="75" height="26" class="pill-light" />
        <circle cx="287" cy="13" r="3" fill="#1572b6" />
        <text x="299" y="17" class="mono pill-txt-light">CSS3</text>

        <rect x="360" y="0" width="105" height="26" class="pill-light" />
        <circle cx="372" cy="13" r="3" fill="#ca8a04" />
        <text x="384" y="17" class="mono pill-txt-light">JavaScript</text>

        <rect x="475" y="0" width="95" height="26" class="pill-light" />
        <circle cx="487" cy="13" r="3" fill="#f05032" />
        <text x="499" y="17" class="mono pill-txt-light">Git/GitHub</text>
      </g>
    </g>

    <!-- Connect Links Footer -->
    <g transform="translate(28, 420)">
      <line x1="0" y1="0" x2="605" y2="0" stroke="#cbd5e1" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" class="mono" font-size="11">CONNECT // </text>
      <text x="85" y="24" fill="#2563eb" class="mono" font-size="11">github.com/quantran303</text>
      <text x="250" y="24" fill="#94a3b8" class="mono" font-size="11">·</text>
      <text x="265" y="24" fill="#0284c7" class="mono" font-size="11">quantrandn2009@gmail.com</text>
      <text x="455" y="24" fill="#94a3b8" class="mono" font-size="11">·</text>
      <text x="470" y="24" fill="#2563eb" class="mono" font-size="11">guns.lol/kingmaster</text>
    </g>
  </g>
</svg>
