<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Tran Quan (kingmaster) - GitHub Profile Banner (Dark Mode)">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Glass Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0c1220" stop-opacity="0.8" />
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeft" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="100" y2="2" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
      .pill { rx: 6px; ry: 6px; fill: #131d31; stroke: #2a3b5c; stroke-width: 1; }
      .pill-txt { font-size: 11px; fill: #94a3b8; font-weight: 500; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="24" fill="url(#bgGrad)" />
  <rect width="1180" height="610" rx="24" fill="url(#gridPattern)" />
  <rect width="1180" height="610" rx="24" fill="url(#glowTopLeft)" />
  <rect width="1180" height="610" rx="24" fill="url(#glowBottomRight)" />
  <rect width="1180" height="610" rx="24" fill="url(#scanlines)" pointer-events="none" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="#22314e" stroke-width="1.5" />
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#borderShimmer)" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(30, 28)">
    <!-- Terminal Traffic Dots -->
    <circle cx="12" cy="14" r="5.5" fill="#ef4444" />
    <circle cx="28" cy="14" r="5.5" fill="#eab308" />
    <circle cx="44" cy="14" r="5.5" fill="#22c55e" />

    <!-- Terminal Breadcrumb -->
    <text x="68" y="18" fill="#64748b" class="mono" font-size="12" font-weight="600">quantran303@developer:~ [ student ]</text>

    <!-- Status Indicator -->
    <g transform="translate(1020, 8)">
      <circle cx="0" cy="10" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="12" y="14" fill="#10b981" class="mono" font-size="11" font-weight="700" letter-spacing="1">ONLINE</text>
    </g>
    <!-- Separator Line -->
    <line x1="0" y1="36" x2="1120" y2="36" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- ================= LEFT PANEL (VISUAL IDENTITY) ================= -->
  <g transform="translate(36, 82)">
    <!-- Glass Background Box -->
    <rect width="420" height="495" rx="16" fill="url(#panelGrad)" stroke="#1e2a44" stroke-width="1" />

    <!-- Header / Tab -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 404 0 C 412.84 0 420 7.16 420 16 L 420 40 L 0 40 Z" fill="#0d1424" />
    <text x="20" y="25" fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">VISUAL.IDENTITY // MATRIX</text>
    <line x1="0" y1="40" x2="420" y2="40" stroke="#1f2d48" stroke-width="1" />

    <!-- ASCII Art Avatar Container -->
    <g transform="translate(25, 60)">
      <rect width="370" height="270" rx="12" fill="#050811" stroke="#1e293b" stroke-width="1" />

      <!-- ASCII Character Matrix Block -->
      <g fill="#818cf8" class="mono" font-size="8.5" letter-spacing="1.8" opacity="0.9">
        <text x="20" y="26">                 ..:::::::::..                 </text>
        <text x="20" y="40">            .:::::::::::::::::::::.            </text>
        <text x="20" y="54">         .:::::::::::::::::::::::::::.         </text>
        <text x="20" y="68">       .::::::####::::::::####:::::::::.       </text>
        <text x="20" y="82">      .:::::########::::########:::::::.       </text>
        <text x="20" y="96">     .:::::##########::##########::::::.      </text>
        <text x="20" y="110">     .:::::######################::::::.      </text>
        <text x="20" y="124">     .::::::####################:::::::.      </text>
        <text x="20" y="138">      .::::::##################:::::::.       </text>
        <text x="20" y="152">       .:::::::##############::::::::.        </text>
        <text x="20" y="166">        .:::::::::########::::::::::.         </text>
        <text x="20" y="180">          .:::::::::####::::::::::.           </text>
        <text x="20" y="194">             .:::::::::::::::.                 </text>
        <text x="20" y="208">           .:+++++++++++++++++:.               </text>
        <text x="20" y="222">        .::+++++++++++++++++++++::.            </text>
        <text x="20" y="236">      .::+++++##+++++++++++++##++++::.         </text>
        <text x="20" y="250">    .:::+++++####+++++++++++####+++++:::.      </text>
      </g>

      <!-- Scanline highlight over ASCII -->
      <line x1="10" y1="20" x2="360" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6">
        <animate attributeName="y1" values="10;260;10" dur="4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="10;260;10" dur="4s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Sub-info below ASCII -->
    <g transform="translate(25, 355)">
      <text x="0" y="16" fill="#64748b" class="mono" font-size="11" letter-spacing="1">IDENTIFIER</text>
      <text x="0" y="38" fill="#f8fafc" class="sans" font-size="18" font-weight="700">Trần Quân</text>
      <text x="110" y="38" fill="#818cf8" class="mono" font-size="12">(@quantran303)</text>

      <text x="0" y="72" fill="#94a3b8" class="mono" font-size="11.5" line-height="1.5">
        <tspan x="0" dy="0">High school student &amp; code enthusiast,</tspan>
        <tspan x="0" dy="18">exploring algorithms, C++ &amp; web technology.</tspan>
      </text>

      <g transform="translate(0, 108)">
        <text x="0" y="12" fill="#38bdf8" class="mono" font-size="11">~/student $</text>
        <text x="80" y="12" fill="#e2e8f0" class="mono" font-size="11">learn --code --grow</text>
        <rect x="235" y="2" width="6" height="12" fill="#818cf8">
          <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL (SYSTEM.INFO) ================= -->
  <g transform="translate(480, 82)">
    <!-- Glass Background Box -->
    <rect width="665" height="495" rx="16" fill="url(#panelGrad)" stroke="#1e2a44" stroke-width="1" />

    <!-- Panel Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 649 0 C 657.84 0 665 7.16 665 16 L 665 40 L 0 40 Z" fill="#0d1424" />
    <text x="24" y="25" fill="#818cf8" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM.INFO // PROFILE</text>
    <text x="560" y="25" fill="#475569" class="mono" font-size="10">sh ./profile.sh</text>
    <line x1="0" y1="40" x2="665" y2="40" stroke="#1f2d48" stroke-width="1" />

    <!-- Primary Title & Role -->
    <g transform="translate(28, 64)">
      <text x="0" y="24" fill="#ffffff" class="sans" font-size="28" font-weight="800" letter-spacing="-0.5">Trần Quân</text>
      <text x="145" y="24" fill="url(#accentText)" class="sans" font-size="28" font-weight="800">/ kingmaster</text>

      <!-- Role -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#38bdf8" class="mono" font-size="14" font-weight="600">&gt; Student · Coding Enthusiast · Future Software Engineer</text>
      </g>
    </g>

    <!-- Metadata Grid Rows -->
    <g transform="translate(28, 142)" class="mono" font-size="12">
      <!-- Row 1 -->
      <text x="0" y="16" fill="#64748b" font-weight="600">&gt; ROLE</text>
      <text x="120" y="16" fill="#e2e8f0">High School Student (Học sinh) 🎓</text>

      <!-- Row 2 -->
      <text x="0" y="44" fill="#64748b" font-weight="600">&gt; LOCATION</text>
      <text x="120" y="44" fill="#e2e8f0">Vietnam 🇻🇳  [ UTC +07:00 ]</text>

      <!-- Row 3 -->
      <text x="0" y="72" fill="#64748b" font-weight="600">&gt; FOCUS</text>
      <text x="120" y="72" fill="#e2e8f0">C++ Algorithms · Python Scripting · Web Basics (HTML/CSS/JS)</text>

      <!-- Row 4 -->
      <text x="0" y="100" fill="#64748b" font-weight="600">&gt; DISCORD</text>
      <text x="120" y="100" fill="#a5b4fc">kingmaster_pc (ID: 930329057390891078)</text>

      <!-- Row 5 -->
      <text x="0" y="128" fill="#64748b" font-weight="600">&gt; STATUS</text>
      <text x="120" y="128" fill="#34d399">Learning every day &amp; exploring computer science</text>
    </g>

    <!-- Tech Stack Category Box -->
    <g transform="translate(28, 290)">
      <text x="0" y="0" fill="#64748b" class="mono" font-size="11" font-weight="700" letter-spacing="1">CURRENT_SKILLS // LANGUAGES &amp; TOOLS</text>

      <!-- Row 1 Pills -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="85" height="26" class="pill" />
        <circle cx="12" cy="13" r="3" fill="#00599c" />
        <text x="24" y="17" class="mono pill-txt">C / C++</text>

        <rect x="95" y="0" width="85" height="26" class="pill" />
        <circle cx="107" cy="13" r="3" fill="#3776ab" />
        <text x="119" y="17" class="mono pill-txt">Python</text>

        <rect x="190" y="0" width="75" height="26" class="pill" />
        <circle cx="202" cy="13" r="3" fill="#e34f26" />
        <text x="214" y="17" class="mono pill-txt">HTML5</text>

        <rect x="275" y="0" width="75" height="26" class="pill" />
        <circle cx="287" cy="13" r="3" fill="#1572b6" />
        <text x="299" y="17" class="mono pill-txt">CSS3</text>

        <rect x="360" y="0" width="105" height="26" class="pill" />
        <circle cx="372" cy="13" r="3" fill="#f7df1e" />
        <text x="384" y="17" class="mono pill-txt">JavaScript</text>

        <rect x="475" y="0" width="95" height="26" class="pill" />
        <circle cx="487" cy="13" r="3" fill="#f05032" />
        <text x="499" y="17" class="mono pill-txt">Git/GitHub</text>
      </g>
    </g>

    <!-- Connect Links Footer -->
    <g transform="translate(28, 420)">
      <line x1="0" y1="0" x2="605" y2="0" stroke="#1f2d48" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" class="mono" font-size="11">CONNECT // </text>
      <text x="85" y="24" fill="#818cf8" class="mono" font-size="11">github.com/quantran303</text>
      <text x="270" y="24" fill="#475569" class="mono" font-size="11">·</text>
      <text x="285" y="24" fill="#818cf8" class="mono" font-size="11">guns.lol/kingmaster</text>
      <text x="440" y="24" fill="#475569" class="mono" font-size="11">·</text>
      <text x="455" y="24" fill="#818cf8" class="mono" font-size="11">ch.tetr.io/u/imkingmaster</text>
    </g>
  </g>
</svg>
